services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: money-tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money-tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    runtime: nvidia
    gpus: all
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./ocr-service:/app
      - ./ocr-training/PaddleOCR/output/receipt_ser_v2/iter_epoch_15:/opt/PaddleOCR/output/receipt_ser_v2/iter_epoch_15:ro
      - ./ocr-training/PaddleOCR/configs/kie/vi_layoutxlm/ser_receipts_v2.yml:/opt/PaddleOCR/configs/kie/vi_layoutxlm/ser_receipts_v2.yml:ro
      - ./ocr-training/PaddleOCR/train_data/receipts/class_list.txt:/opt/PaddleOCR/train_data/receipts/class_list.txt:ro
      - ocr-models:/root/.paddleocr
    shm_size: "1gb"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/money-tracker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      OCR_BASE_URL: http://ocr:8001
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  pgdata:
  ocr-models:
